{% extends "base.html" %}
{% block title %}日志查看{% endblock %}
{% block content %}
<section class="page-container py-12">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="mb-8">
            <a href="{{ url_for('admin.admin_page') }}" class="text-gold-400 hover:text-gold-300 text-sm mb-2 inline-block">
                <i data-lucide="arrow-left" class="w-4 h-4 inline mr-1"></i>返回管理中心
            </a>
            <h1 class="text-xl sm:text-2xl font-bold">系统日志</h1>
            <p class="text-cream/60 text-sm mt-1">可切换查看全局日志、严重错误日志与各模块单独日志（按时间顺序，最早在前）</p>
        </div>

        <!-- 控制栏 -->
        <div class="pixel-card rounded-xl p-4 mb-4">
            <div class="flex flex-wrap items-center gap-3">
                <div class="flex items-center gap-2">
                    <label class="text-sm text-cream/60">日志来源：</label>
                    <select id="log-source" class="px-3 py-1.5 bg-forest-900/60 border border-cream/20 rounded-lg text-sm focus:outline-none focus:border-gold-400 transition-colors">
                        <option value="global">全局日志</option>
                        <option value="fatal">严重错误日志</option>
                    </select>
                </div>
                <div class="flex items-center gap-2">
                    <label class="text-sm text-cream/60">最低等级：</label>
                    <select id="log-level-filter" class="px-3 py-1.5 bg-forest-900/60 border border-cream/20 rounded-lg text-sm focus:outline-none focus:border-gold-400 transition-colors">
                        <option value="DEBUG">DEBUG（显示全部）</option>
                        <option value="INFO">INFO 及以上</option>
                        <option value="WARNING">WARNING 及以上</option>
                        <option value="ERROR">ERROR 及以上</option>
                        <option value="CRITICAL">仅 CRITICAL</option>
                    </select>
                </div>
                <div class="flex items-center gap-2 ml-auto">
                    <span id="log-count" class="text-xs text-cream/50">0 条</span>
                    <a href="{{ url_for('admin.admin_log_settings_page') }}" class="px-3 py-1.5 bg-forest-900/60 hover:bg-forest-800 text-cream/80 text-sm rounded-lg transition-colors border border-cream/20">
                        <i data-lucide="settings-2" class="w-4 h-4 inline mr-1"></i>日志设置
                    </a>
                    <button id="btn-clear-logs" class="px-3 py-1.5 bg-red-500/20 hover:bg-red-500/30 text-red-300 text-sm rounded-lg transition-colors border border-red-500/30">
                        <i data-lucide="trash-2" class="w-4 h-4 inline mr-1"></i>清空
                    </button>
                    <button id="btn-auto-scroll" class="px-3 py-1.5 bg-gold-400/20 hover:bg-gold-400/30 text-gold-300 text-sm rounded-lg transition-colors border border-gold-400/30">
                        <i data-lucide="arrow-up-to-line" class="w-4 h-4 inline mr-1"></i>自动滚动
                    </button>
                </div>
            </div>
        </div>

        <!-- 日志容器 -->
        <div class="pixel-card rounded-xl p-4">
            <div id="log-container" class="bg-forest-950/80 rounded-xl p-4 font-mono text-xs leading-relaxed overflow-y-auto" style="max-height: 70vh; min-height: 400px;">
                <div class="text-cream/40 text-center py-8">加载中...</div>
            </div>
        </div>
    </div>
</section>
{% endblock %}

{% block extra_script %}
<script>
(function() {
    const container = document.getElementById('log-container');
    const sourceSelect = document.getElementById('log-source');
    const levelFilter = document.getElementById('log-level-filter');
    const logCount = document.getElementById('log-count');
    const btnClear = document.getElementById('btn-clear-logs');
    const btnAutoScroll = document.getElementById('btn-auto-scroll');

    const LOGS_URL = '{{ url_for("admin.api_get_logs") }}';
    const CLEAR_URL = '{{ url_for("admin.api_clear_logs") }}';
    const STREAM_URL = '{{ url_for("admin.api_log_stream") }}';
    const MODULES_GET_URL = '{{ url_for("admin.api_get_log_modules") }}';

    // 模块名 → 展示名
    const MODULE_LABELS = {
        'firewall': '防火墙',
        'captcha': '图形验证码',
        'email_code': '邮箱验证码',
        'register': '注册账号',
        'login': '登录账号',
    };
    function moduleLabel(name) {
        return MODULE_LABELS[name] || name;
    }

    let autoScroll = true;
    let eventSource = null;
    let pollTimer = null;
    let entries = [];
    let currentLevel = 'DEBUG';
    let currentSource = 'global';
    let modulesLoaded = false;

    // 日志等级颜色映射
    const LEVEL_COLORS = {
        'DEBUG': 'text-gray-400',
        'INFO': 'text-blue-300',
        'WARNING': 'text-yellow-300',
        'ERROR': 'text-red-400',
        'CRITICAL': 'text-red-500 font-bold',
    };

    // 等级数值映射（用于筛选 >= 当前等级）
    const LEVEL_VALUES = {
        'DEBUG': 0, 'INFO': 1, 'WARNING': 2, 'ERROR': 3, 'CRITICAL': 4,
    };

    // 判断是否匹配筛选（>= 当前等级）
    function matchesLevel(entryLevel, filterLevel) {
        var ev = LEVEL_VALUES[entryLevel] || 0;
        var fv = LEVEL_VALUES[filterLevel] || 0;
        return ev >= fv;
    }

    // 渲染日志（按时间顺序从上到下，旧→新，与控制台一致）
    function render() {
        var filtered = [];
        for (var i = 0; i < entries.length; i++) {
            if (matchesLevel(entries[i].level, currentLevel)) {
                filtered.push(entries[i]);
            }
        }
        if (filtered.length === 0) {
            var emptyText = currentSource === 'fatal' ? '暂无严重错误日志' : '暂无日志';
            container.innerHTML = '<div class="text-cream/40 text-center py-8">' + emptyText + '</div>';
            logCount.textContent = '0 条';
            return;
        }
        var html = '';
        for (var j = 0; j < filtered.length; j++) {
            var e = filtered[j];
            var colorClass = LEVEL_COLORS[e.level] || 'text-cream';
            html += '<div class="hover:bg-forest-800/40 px-2 py-0.5 rounded ' + colorClass + '">' + escapeHtml(e.line) + '</div>';
        }
        container.innerHTML = html;
        logCount.textContent = filtered.length + ' 条';
        if (autoScroll) {
            container.scrollTop = container.scrollHeight;
        }
    }

    // 拉取当前来源的日志（整体替换，用于首屏与轮询）
    function loadLogs() {
        var url = LOGS_URL + '?tail=500&source=' + encodeURIComponent(currentSource);
        fetch(url)
            .then(r => r.json())
            .then(data => {
                if (data.success && data.entries) {
                    entries = data.entries;
                    render();
                }
            })
            .catch(function() {});
    }

    // 连接 SSE（仅全局日志实时推送）
    function connectSSE() {
        if (eventSource) {
            eventSource.close();
        }
        eventSource = new EventSource(STREAM_URL);
        eventSource.addEventListener('connected', function() {
            loadLogs();
        });
        eventSource.onmessage = function(e) {
            try {
                var entry = JSON.parse(e.data);
                entries.push(entry);
                if (entries.length > 2000) {
                    entries = entries.slice(-2000);
                }
                render();
            } catch(err) {}
        };
        eventSource.onerror = function() {
            eventSource.close();
            setTimeout(function() {
                if (currentSource === 'global') connectSSE();
            }, 3000);
        };
    }

    // 切换日志来源
    function applySource(src) {
        currentSource = src;
        if (eventSource) { eventSource.close(); eventSource = null; }
        if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
        entries = [];
        container.innerHTML = '<div class="text-cream/40 text-center py-8">加载中...</div>';
        loadLogs();
        if (src === 'global') {
            connectSSE();
        } else {
            // 非全局来源（严重错误 / 模块单独日志）用轮询刷新
            pollTimer = setInterval(loadLogs, 3000);
        }
    }

    // 等级筛选
    levelFilter.addEventListener('change', function() {
        currentLevel = this.value;
        render();
    });

    // 切换来源
    sourceSelect.addEventListener('change', function() {
        applySource(this.value);
    });

    // 清空（按当前来源）
    btnClear.addEventListener('click', function() {
        CustomModal.confirm('确认清空当前来源（' + sourceSelect.options[sourceSelect.selectedIndex].text + '）的日志？', {
            trigger: this,
            callback: function(confirmed) {
                if (!confirmed) return;
                fetch(CLEAR_URL + '?source=' + encodeURIComponent(currentSource), { method: 'POST' })
                    .then(r => r.json())
                    .then(data => {
                        if (data.success) {
                            entries = [];
                            render();
                        }
                    })
                    .catch(function() {});
            }
        });
    });

    // 自动滚动切换
    btnAutoScroll.addEventListener('click', function() {
        autoScroll = !autoScroll;
        this.classList.toggle('bg-gold-400/20', autoScroll);
        if (autoScroll) {
            container.scrollTop = container.scrollHeight;
        }
    });

    // 自动滚动切换
    btnAutoScroll.addEventListener('click', function() {
        autoScroll = !autoScroll;
        this.classList.toggle('bg-gold-400/20', autoScroll);
        if (autoScroll) {
            container.scrollTop = container.scrollHeight;
        }
    });

    // 加载模块列表 → 填充「来源」下拉
    function loadModules() {
        fetch(MODULES_GET_URL)
            .then(r => r.json())
            .then(function(data) {
                if (!data.success || !data.modules) return;
                modulesLoaded = true;

                // 来源下拉：保留前两项（全局 / 严重错误），其余重建
                while (sourceSelect.options.length > 2) {
                    sourceSelect.remove(2);
                }
                data.modules.forEach(function(m) {
                    var opt = document.createElement('option');
                    opt.value = 'module:' + m.name;
                    opt.textContent = moduleLabel(m.name) + '（模块单独日志）';
                    sourceSelect.appendChild(opt);
                });
            })
            .catch(function() {});
    }

    // HTML 转义
    function escapeHtml(text) {
        var div = document.createElement('div');
        div.textContent = text == null ? '' : text;
        return div.innerHTML;
    }

    // 初始化
    loadModules();
    applySource('global');
})();
</script>
{% endblock %}
