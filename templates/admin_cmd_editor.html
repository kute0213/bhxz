{% extends "base.html" %}
{% block title %}脚本编辑器{% endblock %}
{% block content %}
<section class="page-container py-4 sm:py-6">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <!-- 顶部标题与返回 -->
        <div class="flex items-center justify-between mb-3">
            <div class="flex items-center gap-3">
                <a href="{{ url_for('cmd.cmd_page') }}" class="p-2 -ml-2 text-cream/60 hover:text-gold-400 transition-colors rounded-lg hover:bg-cream/5" title="返回 CMD 控制台">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                </a>
                <div class="w-10 h-10 bg-gold-400/15 rounded-lg flex items-center justify-center">
                    <i data-lucide="code-2" class="w-5 h-5 text-gold-400"></i>
                </div>
                <div>
                    <h1 id="editor-title" class="text-xl sm:text-2xl font-bold">脚本编辑器</h1>
                    <p class="text-cream/50 text-xs">语法高亮 · 代码补全 · 实时错误诊断 · Ctrl+Enter 运行</p>
                </div>
            </div>
            <div id="editor-status-errors" class="px-2.5 py-1 rounded-md text-xs font-medium bg-emerald-500/15 text-emerald-300 border border-emerald-500/20">
                语法正确
            </div>
        </div>

        <!-- 主体区域：工具栏 + 编辑器 + 输出面板 -->
        <div class="flex flex-col" style="height: calc(100vh - 140px); min-height: 520px;">
            <!-- 工具栏 -->
            <div class="pixel-card rounded-xl p-3 mb-4 flex flex-wrap items-center gap-2 flex-shrink-0">
                <button
                    id="editor-run-btn"
                    class="px-4 py-2 bg-gold-400 text-forest-900 font-bold rounded-lg hover:bg-gold-500 transition-colors flex items-center gap-2 text-sm"
                    title="运行脚本 (Ctrl+Enter)"
                >
                    <i id="editor-run-btn-icon" data-lucide="play" class="w-4 h-4"></i>
                    <span id="editor-run-btn-text">运行</span>
                </button>
                <button
                    id="editor-abort-btn"
                    class="px-4 py-2 bg-red-500/80 text-white font-bold rounded-lg hover:bg-red-500 transition-colors flex items-center gap-2 text-sm"
                    title="强制终止正在运行的脚本"
                    style="display:none;"
                >
                    <i data-lucide="square" class="w-4 h-4"></i>
                    <span>强制终止</span>
                </button>
                <button
                    id="editor-save-btn"
                    class="px-4 py-2 bg-forest-700/60 border border-cream/10 text-cream rounded-lg hover:bg-forest-600/60 transition-colors flex items-center gap-2 text-sm"
                    title="保存脚本 (Ctrl+S)"
                >
                    <i data-lucide="save" class="w-4 h-4 text-gold-400"></i>
                    <span>保存脚本</span>
                </button>
                <!-- 自动保存状态指示器 -->
                <div class="flex items-center gap-1.5 text-xs text-cream/40">
                    <span id="save-status-indicator" class="w-2 h-2 rounded-full" style="background:#6b7280;transition:background 0.2s;"></span>
                    <span id="save-status-text">就绪</span>
                </div>
                <button
                    id="editor-format-btn"
                    class="px-3 py-2 bg-cream/5 border border-cream/10 text-cream/80 rounded-lg hover:bg-cream/10 transition-colors flex items-center gap-2 text-sm"
                    title="格式化代码 (Shift+Alt+F)"
                >
                    <i data-lucide="align-left" class="w-4 h-4"></i>
                    <span class="hidden sm:inline">格式化</span>
                </button>
                <button
                    id="editor-clear-output-btn"
                    class="px-3 py-2 bg-cream/5 border border-cream/10 text-cream/80 rounded-lg hover:bg-cream/10 transition-colors flex items-center gap-2 text-sm"
                    title="清空输出"
                >
                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                    <span class="hidden sm:inline">清空输出</span>
                </button>
                <div class="relative">
                    <button
                        id="editor-example-btn"
                        class="px-3 py-2 bg-cream/5 border border-cream/10 text-cream/80 rounded-lg hover:bg-cream/10 transition-colors flex items-center gap-2 text-sm"
                        title="示例代码"
                    >
                        <i data-lucide="lightbulb" class="w-4 h-4 text-gold-400"></i>
                        <span class="hidden sm:inline">示例</span>
                    </button>
                    <div id="editor-example-list" class="hidden absolute right-0 top-full mt-2 pixel-card rounded-lg p-1 z-50 w-48 max-h-72 overflow-y-auto">
                    </div>
                </div>
                <div class="flex-1"></div>
                <div id="editor-cursor-pos" class="text-xs text-cream/40 font-mono hidden sm:block">行 1, 列 1</div>
            </div>

            <!-- Monaco 编辑器（占主要空间） -->
            <div class="pixel-card rounded-xl overflow-hidden relative flex-1 min-h-0 mb-4">
                <div id="monaco-editor" class="absolute inset-0"></div>
            </div>

            <!-- 输出面板（可折叠） -->
            <div id="output-panel" class="pixel-card rounded-xl overflow-hidden flex flex-col flex-shrink-0" style="transition: height 0.25s ease;">
                <div class="flex items-center justify-between px-4 py-2.5 border-b border-cream/10 flex-shrink-0" style="background:rgba(0,0,0,0.2);">
                    <div class="flex items-center gap-2">
                        <button id="output-toggle-btn" class="text-cream/50 hover:text-cream transition-colors p-1" title="收起/展开输出">
                            <i id="output-toggle-icon" data-lucide="chevron-down" class="w-4 h-4"></i>
                        </button>
                        <i data-lucide="terminal" class="w-4 h-4 text-gold-400"></i>
                        <span class="text-sm font-bold">输出</span>
                    </div>
                    <button id="editor-clear-output-btn-2" class="text-cream/40 hover:text-cream/80 transition-colors p-1" title="清空">
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>
                </div>
                <div id="editor-output-wrapper" class="bg-black/40 overflow-y-auto font-mono text-xs sm:text-sm whitespace-pre-wrap" style="color:#4ade80;line-height:1.6; height: 200px;">
                    <div id="editor-output" class="p-4"></div>
                </div>
            </div>
        </div>
    </div>
</section>

<style>
    /* Monaco 字体加载 */
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap');

    /* 输出面板折叠样式 */
    #output-panel.collapsed #editor-output-wrapper { display: none; }
    #output-panel.collapsed { border-bottom: none; }
    #output-toggle-icon { transition: transform 0.25s ease; }
    #output-panel.collapsed #output-toggle-icon { transform: rotate(-90deg); }

    /* 示例下拉菜单动画 */
    #editor-example-list:not(.hidden) {
        animation: dropdownFade 0.15s ease forwards;
    }
    @keyframes dropdownFade {
        from { opacity: 0; transform: translateY(-4px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    /* 输出面板滚动条美化 */
    #editor-output::-webkit-scrollbar { width: 8px; height: 8px; }
    #editor-output::-webkit-scrollbar-track { background: transparent; }
    #editor-output::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
    #editor-output::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

    /* CmdModal 动画 */
    #cmd-modal-root .cmd-modal-enter {
        animation: cmdModalEnter 0.22s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    #cmd-modal-root .cmd-modal-leave {
        animation: cmdModalLeave 0.18s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    @keyframes cmdModalEnter {
        from { opacity: 0; transform: translateY(14px) scale(0.96); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes cmdModalLeave {
        from { opacity: 1; transform: translateY(0) scale(1); }
        to   { opacity: 0; transform: translateY(8px) scale(0.98); }
    }
</style>

<!-- Monaco Editor Loader -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>

<!-- CMD 模块依赖 -->
<script src="{{ url_for('static', filename='js/cmd/modal.js', v='2') }}"></script>
<script src="{{ url_for('static', filename='js/cmd/editor-highlight.js', v='11') }}"></script>
<script src="{{ url_for('static', filename='js/cmd/editor-sse.js', v='10') }}"></script>
<script src="{{ url_for('static', filename='js/cmd/editor.js', v='12') }}"></script>

<script>
    // 从模板注入初始代码
    // 优先使用文件系统脚本，兼容旧的数据库命令
    var __initialCode = '';
    var __editingFilename = null;
    var __editingCmdId = null;
    {% if editing_script %}
        __initialCode = {{ editing_script.content | tojson | safe }};
        __editingFilename = {{ editing_script.filename | tojson | safe }};
    {% elif editing_cmd %}
        __initialCode = {{ editing_cmd.command | tojson | safe }};
        __editingCmdId = {{ editing_cmd.id | tojson | safe }};
    {% endif %}

    // 加载 Monaco 并初始化编辑器
    require.config({
        paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' }
    });
    require(['vs/editor/editor.main'], function () {
        window.ScriptEditor.init(__initialCode, {
            cmdId: __editingCmdId,
            filename: __editingFilename,
        });
        if (window.lucide) lucide.createIcons();
    });

    // 第二个清空按钮
    var clearBtn2 = document.getElementById('editor-clear-output-btn-2');
    if (clearBtn2) {
        clearBtn2.addEventListener('click', function () {
            window.ScriptEditor.clearOutput();
        });
    }

    // 点击外部关闭示例下拉
    document.addEventListener('click', function (e) {
        var exList = document.getElementById('editor-example-list');
        var exBtn = document.getElementById('editor-example-btn');
        if (exList && !exList.contains(e.target) && e.target !== exBtn && !exBtn.contains(e.target)) {
            exList.classList.add('hidden');
        }
    });
</script>
{% endblock %}
