{% extends "base.html" %}
{% block title %}游戏账号管理{% endblock %}
{% block content %}
<section class="page-container py-12">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="mb-8">
            <a href="{{ url_for('admin.admin_page') }}" class="text-gold-400 hover:text-gold-300 text-sm mb-2 inline-block">
                <i data-lucide="arrow-left" class="w-4 h-4 inline mr-1"></i>返回管理中心
            </a>
            <h1 class="text-xl sm:text-2xl font-bold">游戏账号管理</h1>
            <p class="text-cream/60 text-sm mt-1">查看和管理用户已绑定的游戏账号</p>
        </div>

        <div class="pixel-card rounded-xl p-6">
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead>
                        <tr class="text-cream/50 border-b border-cream/10">
                            <th class="text-left py-2 px-2">ID</th>
                            <th class="text-left py-2 px-2">MC 用户名</th>
                            <th class="text-left py-2 px-2">绑定用户</th>
                            <th class="text-left py-2 px-2">绑定时间</th>
                            <th class="text-left py-2 px-2">操作</th>
                        </tr>
                    </thead>
                    <tbody id="binding-list"></tbody>
                </table>
            </div>
        </div>
    </div>
</section>
{% endblock %}

{% block extra_script %}
<script>
(function() {

    function loadBindings() {
        var tbody = document.getElementById('binding-list');
        tbody.innerHTML = '<tr><td colspan="5" class="text-center text-cream/50 py-6">加载中...</td></tr>';
        fetch('/admin/api/game-account-bindings')
            .then(function(r) { return r.json(); })
            .then(function(d) {
                if (!d.success) {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center text-red-400 py-6">加载失败</td></tr>';
                    return;
                }
                var bindings = d.bindings;
                if (bindings.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center text-cream/50 py-6">暂无绑定记录</td></tr>';
                    return;
                }
                var html = '';
                for (var i = 0; i < bindings.length; i++) {
                    var b = bindings[i];
                    html += '<tr class="border-b border-cream/10 hover:bg-forest-900/20">' +
                        '<td class="py-2 px-2 text-cream/50 text-xs">' + b.id + '</td>' +
                        '<td class="py-2 px-2 text-cream font-medium">' + escapeHtml(b.mc_username) + '</td>' +
                        '<td class="py-2 px-2 text-cream/70">' + escapeHtml(b.site_username || '已删除') +
                            ' <span class="text-cream/40 text-xs">(ID: ' + b.user_id + ')</span></td>' +
                        '<td class="py-2 px-2 text-cream/50 text-xs">' + b.created_at + '</td>' +
                        '<td class="py-2 px-2">' +
                            '<button class="btn-unbind px-3 py-1.5 bg-red-500/20 hover:bg-red-500/30 text-red-300 text-xs rounded-lg border border-red-500/30" data-id="' + b.id + '" data-username="' + escapeHtml(b.mc_username) + '">强制解绑</button>' +
                        '</td>' +
                    '</tr>';
                }
                tbody.innerHTML = html;
                bindActions();
            });
    }

    function bindActions() {
        document.querySelectorAll('.btn-unbind').forEach(function(btn) {
            btn.addEventListener('click', function() {
                var id = this.dataset.id;
                var username = this.dataset.username;
                CustomModal.confirm('确认强制解绑账号 <strong>' + escapeHtml(username) + '</strong>？此操作不可撤销。', {
                    trigger: this,
                    callback: function(confirmed) {
                        if (!confirmed) return;
                        fetch('/admin/api/game-account-bindings/' + id + '/unbind', { method: 'POST' })
                            .then(function(r) { return r.json(); })
                            .then(function(d) {
                                CustomModal.alert(d.message, { type: d.success ? 'success' : 'error' });
                                if (d.success) loadBindings();
                            });
                    }
                });
            });
        });
    }

    function escapeHtml(str) {
        var div = document.createElement('div');
        div.appendChild(document.createTextNode(str));
        return div.innerHTML;
    }

    loadBindings();
})();
</script>
{% endblock %}
