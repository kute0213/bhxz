{% extends "base.html" %}
{% from 'macros/page_header.html' import page_header %}
{% block title %}公开文件管理{% endblock %}
{% block content %}
<section class="page-container py-12">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
        {{ page_header(
            title='公开文件管理',
            subtitle='将本地文件或目录映射到URL对外公开访问',
            back_url=url_for('admin.admin_page'),
            back_text='返回管理中心'
        ) }}

        <div class="pixel-card rounded-xl p-6 mb-8">
            <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
                <i data-lucide="plus-circle" class="w-5 h-5 text-gold-400"></i>
                添加公开路径
            </h2>
            <form method="POST" action="{{ url_for('public.admin_public_files_add') }}" class="space-y-4">
                {{ csrf_field() }}
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-cream/80 mb-2">
                            <i data-lucide="link" class="w-4 h-4 inline mr-1"></i>
                            公开 URL 路径
                        </label>
                        <input type="text" name="url_path" required
