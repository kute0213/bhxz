{% extends "base.html" %}
{% block title %}终端与脚本{% endblock %}
{% block content %}
<section class="page-container py-12">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="text-center mb-8 sm:mb-10">
            <h1 class="text-2xl sm:text-3xl font-bold mb-3">终端与脚本</h1>
            <p class="text-cream/60 text-sm sm:text-base">快捷命令、脚本自动化、实时终端</p>
        </div>

        <!-- 顶部操作栏 -->
        <div class="flex flex-wrap gap-3 mb-6 justify-center sm:justify-start">
            <a
                href="{{ url_for('script.terminal_page') }}"
                class="px-5 py-2.5 bg-gold-400 text-forest-900 font-bold rounded-lg hover:bg-gold-500 transition-colors flex items-center gap-2"
            >
                <i data-lucide="terminal" class="w-5 h-5"></i>
                实时终端
            </a>
            <button
                id="add-script-btn"
                class="px-5 py-2.5 bg-forest-700/60 border border-cream/10 text-cream rounded-lg hover:bg-forest-600/60 transition-colors flex items-center gap-2"
            >
                <i data-lucide="plus" class="w-5 h-5 text-gold-400"></i>
                添加快捷命令
            </button>
            <a
                href="{{ url_for('script.script_editor_page') }}"
                class="px-5 py-2.5 bg-purple-600/30 border border-purple-400/30 text-purple-200 rounded-lg hover:bg-purple-600/40 transition-colors flex items-center gap-2"
            >
                <i data-lucide="code-2" class="w-5 h-5"></i>
                脚本编辑器
            </a>
            <a
                href="{{ url_for('scheduled.scheduled_page') }}"
                class="px-5 py-2.5 bg-blue-600/30 border border-blue-400/30 text-blue-200 rounded-lg hover:bg-blue-600/40 transition-colors flex items-center gap-2"
            >
                <i data-lucide="calendar-clock" class="w-5 h-5"></i>
                定时任务
            </a>
        </div>

        <!-- 脚本列表 -->
        <div class="mb-8">
            <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
                <i data-lucide="file-code" class="w-5 h-5 text-purple-400"></i>
                脚本
                <span class="text-xs text-cream/40 font-normal">（数据库）</span>
            </h2>
            <div id="script-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- JS 动态渲染 -->
            </div>
        </div>

        <!-- 快捷命令列表 -->
        <div>
            <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
                <i data-lucide="zap" class="w-5 h-5 text-gold-400"></i>
                快捷命令
                <span class="text-xs text-cream/40 font-normal">（Shell 命令）</span>
            </h2>
            <div id="preset-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- JS 动态渲染 -->
            </div>
        </div>
    </div>
</section>
{% endblock %}

{% block extra_style %}
<style>
    /* ScriptModal 动画 */
    #script-modal-root .script-modal-enter {
        animation: scriptModalEnter 0.22s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    #script-modal-root .script-modal-leave {
        animation: scriptModalLeave 0.18s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    @keyframes scriptModalEnter {
        from { opacity: 0; transform: translateY(14px) scale(0.96); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes scriptModalLeave {
        from { opacity: 1; transform: translateY(0) scale(1); }
        to   { opacity: 0; transform: translateY(8px) scale(0.98); }
    }
</style>
{% endblock %}

{% block extra_script %}
<script src="{{ url_for('static', filename='js/script/modal.js', v='4') }}"></script>
<script src="{{ url_for('static', filename='js/script/presets.js', v='4') }}"></script>
<script src="{{ url_for('static', filename='js/script/main.js', v='4') }}"></script>
{% endblock %}

{% block page_modals %}
<!-- 添加/编辑命令弹窗 -->
<div id="script-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="pixel-card rounded-xl p-6 w-full max-w-md">
        <h3 id="script-modal-title" class="text-xl font-bold mb-4">添加快捷命令</h3>
        <form id="script-form">
            <input type="hidden" id="script-form-id" value="" />
            <div class="mb-4">
                <label class="block text-sm text-cream/70 mb-1">名称</label>
                <input
                    type="text"
                    id="script-form-name"
                    class="w-full bg-black/30 border border-cream/10 rounded-lg px-4 py-2 text-cream placeholder-cream/30 focus:outline-none focus:border-gold-400/50"
                    placeholder="例如：查看磁盘空间"
                    required
                />
            </div>
            <div class="mb-4">
                <label class="block text-sm text-cream/70 mb-1">类型</label>
                <select
                    id="script-form-type"
                    class="w-full bg-black/30 border border-cream/10 rounded-lg px-4 py-2 text-cream focus:outline-none focus:border-gold-400/50"
                >
                    <option value="cmd">脚本命令（服务端执行）</option>
                    <option value="script">Python 脚本（后端 SSE 执行）</option>
                </select>
            </div>
            <div class="mb-4">
                <label class="block text-sm text-cream/70 mb-1">内容</label>
                <textarea
                    id="script-form-command"
                    class="w-full bg-black/30 border border-cream/10 rounded-lg px-4 py-2 text-cream placeholder-cream/30 focus:outline-none focus:border-gold-400/50 font-mono text-sm"
                    placeholder="脚本命令或 Python 脚本代码"
                    rows="5"
                    required
                ></textarea>
            </div>
            <div class="mb-4">
                <label class="block text-sm text-cream/70 mb-1">描述（可选）</label>
                <input
                    type="text"
                    id="script-form-desc"
                    class="w-full bg-black/30 border border-cream/10 rounded-lg px-4 py-2 text-cream placeholder-cream/30 focus:outline-none focus:border-gold-400/50"
                    placeholder="简短描述"
                />
            </div>
            <div class="mb-6">
                <label class="block text-sm text-cream/70 mb-1">排序</label>
                <input
                    type="number"
                    id="script-form-sort"
                    class="w-full bg-black/30 border border-cream/10 rounded-lg px-4 py-2 text-cream placeholder-cream/30 focus:outline-none focus:border-gold-400/50"
                    value="0"
                />
            </div>
            <div class="flex gap-3">
                <button
                    type="button"
                    id="script-modal-cancel"
                    class="flex-1 py-2 bg-cream/10 text-cream rounded-lg hover:bg-cream/20 transition-colors"
                >
                    取消
                </button>
                <button
                    type="submit"
                    class="flex-1 py-2 bg-gold-400 text-forest-900 font-bold rounded-lg hover:bg-gold-500 transition-colors"
                >
                    保存
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
