{% extends "base.html" %}
{% block title %}系统日志{% endblock %}
{% block content %}
    <section class="page-container py-12">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col gap-4 mb-8">
                <div>
                    <a href="{{ url_for('admin.admin_page') }}" class="text-gold-400 hover:text-gold-300 text-sm mb-2 inline-block">
                        <i data-lucide="arrow-left" class="w-4 h-4 inline mr-1"></i>返回管理中心
                    </a>
                    <h1 class="text-xl sm:text-2xl font-bold">系统日志</h1>
                    <p class="text-cream/60 text-sm mt-1">实时查看系统运行日志（内存缓冲，最多保留 2000 条）</p>
                </div>
                <div class="flex flex-wrap items-center gap-2 sm:gap-3">
                    <!-- 日志等级过滤 -->
                    <select id="level-filter" class="px-3 py-1.5 bg-forest-800 border border-forest-700 rounded text-sm text-cream">
                        <option value="DEBUG">DEBUG</option>
                        <option value="INFO">INFO</option>
                        <option value="WARNING">WARNING</option>
                        <option value="ERROR">ERROR</option>
                        <option value="CRITICAL">CRITICAL</option>
                    </select>
                    <!-- 滚动控制 -->
                    <label class="flex items-center gap-1.5 text-sm text-cream/60 cursor-pointer">
                        <input type="checkbox" id="auto-scroll" checked class="rounded border-forest-700 bg-forest-800">
                        自动滚动
                    </label>
                    <!-- 清空按钮 -->
                    <button id="btn-clear" class="btn-secondary px-3 py-1.5 rounded text-sm">
                        <i data-lucide="trash-2" class="w-4 h-4 inline mr-1"></i>清空显示
                    </button>
                    <!-- 连接状态 -->
                    <span id="conn-status" class="text-xs px-2 py-1 rounded bg-green-500/20 text-green-400">已连接</span>
                </div>
            </div>

            <div class="pixel-card rounded-xl overflow-hidden">
                <div id="log-container" class="overflow-y-auto" style="max-height: 70vh; font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', monospace;">
                    <div id="log-content" class="p-4 text-xs leading-relaxed">
                        <div class="text-cream/40 text-center py-8">正在连接日志流...</div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        (function() {
            const logContent = document.getElementById('log-content');
            const logContainer = document.getElementById('log-container');
            const levelFilter = document.getElementById('level-filter');
            const autoScroll = document.getElementById('auto-scroll');
            const connStatus = document.getElementById('conn-status');
            const btnClear = document.getElementById('btn-clear');

            // 日志等级颜色映射
            const LEVEL_COLORS = {
                'DEBUG':   'text-gray-500',
                'INFO':    'text-green-400',
                'WARNING': 'text-yellow-400',
                'ERROR':   'text-red-400',
                'CRITICAL':'text-red-500 font-bold',
            };

            // 日志等级数值（用于 ≥ 过滤）
            const LEVEL_NUMBERS = {
                'DEBUG': 0,
                'INFO': 1,
                'WARNING': 2,
                'ERROR': 3,
                'CRITICAL': 4,
            };

            let eventSource = null;
            let logCount = 0;

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            function appendLog(entry) {
                // 等级过滤：显示 >= 选中等级的日志
                const filter = levelFilter.value;
                if (filter) {
                    const filterNum = LEVEL_NUMBERS[filter] ?? -1;
                    const entryNum = LEVEL_NUMBERS[entry.level] ?? -1;
                    if (entryNum < filterNum) return;
                }

                const levelClass = LEVEL_COLORS[entry.level] || 'text-cream';
                const line = document.createElement('div');
                line.className = 'py-0.5 border-b border-cream/5 flex items-start gap-2';
                line.innerHTML = `
                    <span class="text-cream/40 whitespace-nowrap flex-shrink-0">${escapeHtml(entry.timestamp)}</span>
                    <span class="${levelClass} whitespace-nowrap flex-shrink-0 font-mono">[${escapeHtml(entry.level)}]</span>
                    <span class="text-cream/50 whitespace-nowrap flex-shrink-0 font-mono">[${escapeHtml(entry.thread)}]</span>
                    <span class="text-gold-400 whitespace-nowrap flex-shrink-0">[${escapeHtml(entry.event)}]</span>
                    <span class="text-cream/80 break-all">${escapeHtml(entry.detail || '')}</span>
                `;
                // 最新日志在最上面
                logContent.prepend(line);
                logCount++;

                // 自动滚动到顶部（新日志出现的位置）
                if (autoScroll.checked) {
                    logContainer.scrollTop = 0;
                }
            }

            function connectSSE() {
                if (eventSource) {
                    eventSource.close();
                }

                connStatus.textContent = '连接中...';
                connStatus.className = 'text-xs px-2 py-1 rounded bg-yellow-500/20 text-yellow-400';

                eventSource = new EventSource('{{ url_for("admin.admin_system_logs_sse") }}');

                eventSource.addEventListener('history', function(e) {
                    try {
                        const logs = JSON.parse(e.data);
                        logContent.innerHTML = '';
                        logCount = 0;
                        // get_log_buffer_tail 返回的是倒序（最新在前），
                        // 而我们要 prepend 到顶部，所以先反转成从旧到新
                        logs.reverse().forEach(appendLog);
                        connStatus.textContent = '已连接';
                        connStatus.className = 'text-xs px-2 py-1 rounded bg-green-500/20 text-green-400';
                    } catch (err) {
                        console.error('解析历史日志失败:', err);
                    }
                });

                eventSource.onmessage = function(e) {
                    try {
                        const entry = JSON.parse(e.data);
                        appendLog(entry);
                    } catch (err) {
                        // 忽略心跳等非 JSON 消息
                    }
                };

                eventSource.onerror = function() {
                    connStatus.textContent = '已断开';
                    connStatus.className = 'text-xs px-2 py-1 rounded bg-red-500/20 text-red-400';
                    // 3 秒后重连
                    setTimeout(connectSSE, 3000);
                };
            }

            // 等级过滤变更时重新挂载
            levelFilter.addEventListener('change', function() {
                // 重新连接 SSE 以获取历史（过滤由前端完成）
                connectSSE();
            });

            // 清空显示
            btnClear.addEventListener('click', function() {
                logContent.innerHTML = '';
                logCount = 0;
            });

            // 启动 SSE 连接
            connectSSE();
        })();
    </script>
{% endblock %}
