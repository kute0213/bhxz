{% extends "base.html" %}
{% from 'macros/page_header.html' import page_header %}
{% block title %}系统设置{% endblock %}
{% block content %}

            </div>
        </div>

        <!-- 设置分类容器 -->
        <div id="settings-container" class="space-y-6">

        </div>
    </div>
</section>
