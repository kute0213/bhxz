<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        /* 配色与官网一致：暗灰蓝磨砂玻璃 + 金色点缀（见 static/css/base.css） */
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(145deg, #424b5d 0%, #384152 48%, #303747 100%);
            background-attachment: fixed;
            background-image:
                radial-gradient(ellipse 55% 45% at 12% 5%, rgba(103, 232, 249, 0.11) 0%, transparent 65%),
                radial-gradient(ellipse 60% 55% at 92% 92%, rgba(139, 92, 246, 0.10) 0%, transparent 65%),
                radial-gradient(ellipse 40% 40% at 60% 100%, rgba(251, 191, 36, 0.05) 0%, transparent 70%);
            background-repeat: no-repeat;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        .mail-wrap {
            max-width: 520px;
            width: 100%;
            margin: 0 auto;
            padding: 24px;
            box-sizing: border-box;
            color: #f3f6fb;
        }
        .mail-card {
            position: relative;
            background: linear-gradient(145deg, rgba(67, 77, 97, 0.95) 0%, rgba(52, 61, 79, 0.95) 100%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 28px;
            overflow: hidden;
            box-shadow:
                0 18px 48px rgba(19, 23, 32, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.07);
        }
        /* 磨砂玻璃顶部高光描边 */
        .mail-card::before {
            content: '';
            position: absolute;
            top: 0; left: 12%; right: 12%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(251, 191, 36, 0.45), transparent);
            pointer-events: none;
        }
        /* 光线散射层 —— 模拟磨砂玻璃漫射光线 */
        .mail-card-glow {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(ellipse 60% 35% at 22% 0%, rgba(255, 255, 255, 0.07) 0%, transparent 60%);
        }
        /* 细微噪点纹理 —— 模拟磨砂玻璃蚀刻表面微观散射 */
        .mail-card-noise {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0.045;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-repeat: repeat;
            background-size: 200px 200px;
        }
        .mail-header {
            position: relative;
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .mail-logo {
            width: 48px;
            height: 48px;
            background: linear-gradient(145deg, rgba(251, 191, 36, 0.20), rgba(251, 191, 36, 0.08));
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            border: 1px solid rgba(251, 191, 36, 0.26);
            box-shadow: 0 6px 18px rgba(251, 191, 36, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.12);
        }
        .mail-logo svg {
            width: 24px;
            height: 24px;
            color: #fbbf24;
        }
        .mail-title {
            position: relative;
            color: {{ title_color | default('#fbbf24') }};
            font-size: 22px;
            font-weight: bold;
            margin: 0;
            letter-spacing: 0.02em;
        }
        .mail-body {
            position: relative;
            font-size: 15px;
            line-height: 1.7;
            color: #f3f6fb;
        }
        .mail-body p {
            margin: 8px 0;
        }
        /* 高亮引用块（音频/指南标题等） */
        .mail-highlight {
            font-size: 17px;
            font-weight: bold;
            padding: 14px;
            background: linear-gradient(145deg, rgba(251, 191, 36, 0.12), rgba(251, 191, 36, 0.05));
            color: #fbbf24;
            border-radius: 12px;
            margin: 14px 0;
            word-break: break-all;
            border: 1px solid rgba(251, 191, 36, 0.18);
            text-align: center;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }
        /* 验证码 */
        .mail-code {
            font-size: 32px;
            font-weight: bold;
            color: #fbbf24;
            letter-spacing: 8px;
            background: linear-gradient(145deg, rgba(251, 191, 36, 0.12), rgba(251, 191, 36, 0.05));
            padding: 18px;
            border-radius: 12px;
            text-align: center;
            margin: 16px 0;
            word-break: break-all;
            border: 1px solid rgba(251, 191, 36, 0.22);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }
        /* 审核结果状态卡 */
        .mail-status {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            margin: 16px 0;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }
        .mail-status-success {
            background: linear-gradient(145deg, rgba(74, 222, 128, 0.12), rgba(74, 222, 128, 0.04));
            border-color: rgba(74, 222, 128, 0.28);
        }
        .mail-status-fail {
            background: linear-gradient(145deg, rgba(248, 113, 113, 0.12), rgba(248, 113, 113, 0.04));
            border-color: rgba(248, 113, 113, 0.28);
        }
        .mail-status-pending {
            background: linear-gradient(145deg, rgba(251, 191, 36, 0.12), rgba(251, 191, 36, 0.04));
            border-color: rgba(251, 191, 36, 0.28);
        }
        .mail-status-icon {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .mail-status-icon svg { width: 18px; height: 18px; }
        .mail-status-success .mail-status-icon { background: rgba(74, 222, 128, 0.18); color: #4ade80; }
        .mail-status-fail .mail-status-icon { background: rgba(248, 113, 113, 0.18); color: #f87171; }
        .mail-status-pending .mail-status-icon { background: rgba(251, 191, 36, 0.18); color: #fbbf24; }
        .mail-status-title {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 3px;
        }
        .mail-status-success .mail-status-title { color: #4ade80; }
        .mail-status-fail .mail-status-title { color: #f87171; }
        .mail-status-pending .mail-status-title { color: #fbbf24; }
        .mail-status-desc {
            font-size: 13px;
            line-height: 1.6;
            color: rgba(243, 246, 251, 0.6);
        }
        /* 正文中的高亮名称（作者 / 发送者），复用模板类代替内联样式 */
        .mail-name { color: #fbbf24; font-weight: bold; }
        .mail-muted {
            color: rgba(243, 246, 251, 0.5);
            font-size: 13px;
            line-height: 1.6;
            margin: 12px 0 0 0;
        }
        .mail-footer {
            position: relative;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            text-align: center;
            color: rgba(243, 246, 251, 0.45);
            font-size: 12px;
        }
        .mail-content h1 { font-size: 20px; font-weight: bold; margin: 18px 0 10px; color: #fbbf24; }
        .mail-content h2 { font-size: 18px; font-weight: bold; margin: 16px 0 8px; color: #fbbf24; }
        .mail-content h3 { font-size: 16px; font-weight: bold; margin: 14px 0 6px; color: #fbbf24; }
        .mail-content p { margin: 8px 0; line-height: 1.7; }
        .mail-content ul, .mail-content ol { margin: 8px 0; padding-left: 24px; }
        .mail-content li { margin: 4px 0; line-height: 1.6; }
        .mail-content strong { color: #fbbf24; }
        .mail-content a { color: #fbbf24; text-decoration: underline; }
        .mail-content blockquote {
            border-left: 3px solid #fbbf24;
            margin: 12px 0;
            padding: 8px 16px;
            color: rgba(243, 246, 251, 0.55);
            background: rgba(251, 191, 36, 0.04);
            border-radius: 0 8px 8px 0;
        }
        .mail-content code {
            font-family: 'Courier New', Courier, monospace;
            background: rgba(251, 191, 36, 0.08);
            color: #fbbf24;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.9em;
        }
        .mail-content pre {
            background: rgba(0, 0, 0, 0.3);
            color: #e5e9f0;
            padding: 12px 16px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 12px 0;
        }
        .mail-content pre code { background: none; color: inherit; padding: 0; font-size: 0.85em; line-height: 1.5; }
        .mail-content hr { border: none; border-top: 1px solid rgba(251, 191, 36, 0.15); margin: 20px 0; }
        .mail-content table { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 14px; }
        .mail-content th, .mail-content td { border: 1px solid rgba(255, 255, 255, 0.16); padding: 8px 12px; text-align: left; }
        .mail-content th { background: rgba(251, 191, 36, 0.08); color: #fbbf24; font-weight: bold; }
        .mail-content img { max-width: 100%; height: auto; border-radius: 4px; }

        @media only screen and (max-width: 480px) {
            .mail-wrap { padding: 16px !important; }
            .mail-card { padding: 18px !important; border-radius: 14px !important; }
            .mail-title { font-size: 18px !important; }
            .mail-code { font-size: 26px !important; letter-spacing: 4px !important; padding: 14px !important; }
            .mail-highlight { padding: 12px !important; font-size: 15px !important; }
            .mail-status { padding: 12px !important; }
            .mail-content h1 { font-size: 17px !important; }
            .mail-content h2 { font-size: 15px !important; }
            .mail-content pre { padding: 8px !important; font-size: 12px !important; }
            .mail-content table { font-size: 12px !important; }
            .mail-content th, .mail-content td { padding: 6px 8px !important; }
        }
    </style>
</head>
<body>
    <div class="mail-wrap">
        <div class="mail-card">
            <div class="mail-card-glow"></div>
            <div class="mail-card-noise"></div>
            <div class="mail-header">
                <div class="mail-logo">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
                </div>
                <h2 class="mail-title">{{ title }}</h2>
            </div>
            <div class="mail-body">
                {% block content %}{% endblock %}
            </div>
            <div class="mail-footer">
                <p>滨海小镇服务器 · 本邮件由系统自动发送，请勿直接回复</p>
            </div>
        </div>
    </div>
</body>
</html>
