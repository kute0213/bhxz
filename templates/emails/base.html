<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0d1b0f;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        .mail-wrap {
            max-width: 520px;
            width: 100%;
            margin: 0 auto;
            padding: 24px;
            box-sizing: border-box;
            color: #e8e4d9;
        }
        .mail-card {
            background: rgba(12, 28, 18, 0.85);
            border: 1px solid rgba(244, 208, 63, 0.15);
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }
        .mail-header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(244, 208, 63, 0.12);
        }
        .mail-logo {
            width: 44px;
            height: 44px;
            background: rgba(244, 208, 63, 0.15);
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            border: 1px solid rgba(244, 208, 63, 0.2);
        }
        .mail-logo svg {
            width: 24px;
            height: 24px;
            color: #f4d03f;
        }
        .mail-title {
            color: {{ title_color | default('#f4d03f') }};
            font-size: 22px;
            font-weight: bold;
            margin: 0;
        }
        .mail-body {
            font-size: 15px;
            line-height: 1.7;
            color: #e8e4d9;
        }
        .mail-body p {
            margin: 8px 0;
        }
        .mail-highlight {
            font-size: 17px;
            font-weight: bold;
            padding: 14px;
            background: rgba(244, 208, 63, 0.08);
            color: #f4d03f;
            border-radius: 10px;
            margin: 14px 0;
            word-break: break-all;
            border: 1px solid rgba(244, 208, 63, 0.15);
            text-align: center;
        }
        .mail-code {
            font-size: 32px;
            font-weight: bold;
            color: #f4d03f;
            letter-spacing: 8px;
            background: rgba(244, 208, 63, 0.08);
            padding: 18px;
            border-radius: 10px;
            text-align: center;
            margin: 16px 0;
            word-break: break-all;
            border: 1px solid rgba(244, 208, 63, 0.2);
        }
        .mail-muted {
            color: #888888;
            font-size: 13px;
            line-height: 1.6;
            margin: 12px 0 0 0;
        }
        .mail-footer {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid rgba(244, 208, 63, 0.08);
            text-align: center;
            color: #888888;
            font-size: 12px;
        }
        .mail-content h1 { font-size: 20px; font-weight: bold; margin: 18px 0 10px; color: #f4d03f; }
        .mail-content h2 { font-size: 18px; font-weight: bold; margin: 16px 0 8px; color: #f4d03f; }
        .mail-content h3 { font-size: 16px; font-weight: bold; margin: 14px 0 6px; color: #f4d03f; }
        .mail-content p { margin: 8px 0; line-height: 1.7; }
        .mail-content ul, .mail-content ol { margin: 8px 0; padding-left: 24px; }
        .mail-content li { margin: 4px 0; line-height: 1.6; }
        .mail-content strong { color: #f4d03f; }
        .mail-content a { color: #f4d03f; text-decoration: underline; }
        .mail-content blockquote {
            border-left: 3px solid #f4d03f;
            margin: 12px 0;
            padding: 8px 16px;
            color: #888888;
            background: rgba(244, 208, 63, 0.04);
            border-radius: 0 8px 8px 0;
        }
        .mail-content code {
            font-family: 'Courier New', Courier, monospace;
            background: rgba(244, 208, 63, 0.08);
            color: #f4d03f;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.9em;
        }
        .mail-content pre {
            background: rgba(0, 0, 0, 0.3);
            color: #e0e0e0;
            padding: 12px 16px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 12px 0;
        }
        .mail-content pre code { background: none; color: inherit; padding: 0; font-size: 0.85em; line-height: 1.5; }
        .mail-content hr { border: none; border-top: 1px solid rgba(244, 208, 63, 0.15); margin: 20px 0; }
        .mail-content table { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 14px; }
        .mail-content th, .mail-content td { border: 1px solid rgba(244, 208, 63, 0.2); padding: 8px 12px; text-align: left; }
        .mail-content th { background: rgba(244, 208, 63, 0.08); color: #f4d03f; font-weight: bold; }
        .mail-content img { max-width: 100%; height: auto; border-radius: 4px; }

        @media only screen and (max-width: 480px) {
            .mail-wrap { padding: 16px !important; }
            .mail-card { padding: 18px !important; border-radius: 14px !important; }
            .mail-title { font-size: 18px !important; }
            .mail-code { font-size: 26px !important; letter-spacing: 4px !important; padding: 14px !important; }
            .mail-highlight { padding: 12px !important; font-size: 15px !important; }
            .mail-content h1 { font-size: 17px !important; }
            .mail-content h2 { font-size: 15px !important; }
            .mail-content pre { padding: 8px !important; font-size: 12px !important; }
            .mail-content table { font-size: 12px !important; }
            .mail-content th, .mail-content td { padding: 6px 8px !important; }
        }
    </style>
</head>
<body>
    <div class="mail-wrap">
        <div class="mail-card">
            <div class="mail-header">
                <div class="mail-logo">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
                </div>
                <h2 class="mail-title">{{ title }}</h2>
            </div>
            <div class="mail-body">
                {% block content %}{% endblock %}
            </div>
            <div class="mail-footer">
                <p>滨海小镇服务器 · 本邮件由系统自动发送，请勿直接回复</p>
            </div>
        </div>
    </div>
</body>
</html>
