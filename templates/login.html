{% extends "base.html" %}
{% block title %}登录{% endblock %}
{% block content %}
    <section class="page-container flex items-center justify-center py-12">
        <div class="max-w-md w-full mx-6">
            <div class="pixel-card rounded-xl p-8">
                <div class="text-center mb-8">
                    <div class="w-16 h-16 mx-auto bg-gold-400/20 rounded-full flex items-center justify-center mb-4">
                        <i data-lucide="log-in" class="w-8 h-8 text-gold-400"></i>
                    </div>
                    <h1 class="text-2xl font-bold mb-2">登录账户</h1>
                    <p class="text-cream/60 text-sm">欢迎回来，继续你的滨海小镇</p>
                </div>

                {% if request.args.get('registered') %}
                <div class="mb-6 p-4 bg-green-900/30 border border-green-500/30 rounded-lg text-green-300 text-sm">
                    <i data-lucide="check-circle" class="w-4 h-4 inline mr-1"></i>注册成功，请登录！
                </div>
                {% endif %}

                {% if error %}
                <div class="mb-6 p-4 bg-red-900/30 border border-red-500/30 rounded-lg text-red-300 text-sm">
                    <i data-lucide="alert-circle" class="w-4 h-4 inline mr-1"></i>{{ error }}
                </div>
                {% endif %}

                <form method="POST" class="space-y-5">
                    <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
                    <div>
                        <label class="block text-sm font-medium mb-2 text-cream/80">用户名</label>
                        <input type="text" name="username" required class="input-field w-full px-4 py-3 rounded-lg" placeholder="请输入用户名">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2 text-cream/80">密码</label>
                        <input type="password" name="password" required class="input-field w-full px-4 py-3 rounded-lg" placeholder="请输入密码">
                    </div>
                    <button type="submit" class="btn-primary w-full py-3 rounded-lg font-bold">登录</button>
                </form>

                <div class="mt-6 pt-6 border-t border-forest-700 text-center">
                    <p class="text-sm text-cream/60">
                        还没有账户？ <a href="{{ url_for('main.register') }}" class="text-gold-400 hover:text-gold-500 font-medium">立即注册</a>
                    </p>
                </div>
            </div>
        </div>
    </section>
{% endblock %}
