{% extends "base.html" %}
{% block title %}找回密码{% endblock %}
{% block content %}
    <section class="page-container flex items-center justify-center py-12">
        <div class="max-w-md w-full mx-4 sm:mx-6">
            <div class="pixel-card rounded-xl p-5 sm:p-8">
                <div class="text-center mb-6 sm:mb-8">
                    <div class="w-16 h-16 mx-auto bg-gold-400/20 rounded-full flex items-center justify-center mb-4">
                        <i data-lucide="key-round" class="w-8 h-8 text-gold-400"></i>
                    </div>
                    <h1 class="text-xl sm:text-2xl font-bold mb-2">找回密码</h1>
                    <p class="text-cream/60 text-sm">通过邮箱验证码重置你的密码</p>
                </div>

                {% if error %}
                <div class="mb-6 p-4 bg-red-900/30 border border-red-500/30 rounded-lg text-red-300 text-sm">
                    <i data-lucide="alert-circle" class="w-4 h-4 inline mr-1"></i>{{ error }}
                </div>
                {% endif %}

                <form method="POST" class="space-y-5" id="forgot-form">
                    <div>
                        <label class="block text-sm font-medium mb-2 text-cream/80">用户名</label>
                        <input type="text" name="username" id="fp-username" required class="input-field w-full px-4 py-3 rounded-lg" placeholder="请输入用户名">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2 text-cream/80">邮箱地址</label>
                        <input type="email" name="email" id="fp-email" required class="input-field w-full px-4 py-3 rounded-lg" placeholder="请输入绑定的邮箱地址">
                        <p class="text-xs text-cream/40 mt-1.5">仅支持已绑定邮箱的账户找回密码</p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2 text-cream/80">图形验证码</label>
                        <div class="flex flex-wrap gap-2 sm:gap-3 items-center">
                            <input type="text" name="captcha" required class="input-field flex-1 min-w-[120px] px-4 py-3 rounded-lg" placeholder="请输入答案">
                            <input type="hidden" name="captcha_id" id="captcha-id" value="">
                            <div class="flex items-center gap-1.5">
                                <img id="captcha-img" src="" alt="验证码" class="h-11 sm:h-12 rounded cursor-pointer hover:opacity-80 transition-opacity border border-forest-700/50" title="点击刷新">
                                <button type="button" onclick="loadCaptcha()" class="p-1.5 text-cream/50 hover:text-gold-400 transition-colors rounded-lg hover:bg-cream/5" title="刷新验证码">
                                    <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2 text-cream/80">邮箱验证码</label>
                        <div class="flex flex-wrap gap-2 items-center">
                            <input type="text" name="email_code" required class="input-field flex-1 min-w-[120px] px-4 py-3 rounded-lg" placeholder="请输入邮箱验证码">
                            <button type="button" id="btn-send-email-code" class="px-4 py-3 bg-gold-500/20 hover:bg-gold-500/30 text-gold-300 text-sm rounded-lg border border-gold-500/30 transition-colors whitespace-nowrap">
                                发送验证码
                            </button>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2 text-cream/80">新密码</label>
                        <input type="password" name="new_password" required minlength="6" class="input-field w-full px-4 py-3 rounded-lg" placeholder="至少 6 位">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2 text-cream/80">确认新密码</label>
                        <input type="password" name="confirm_password" required minlength="6" class="input-field w-full px-4 py-3 rounded-lg" placeholder="再次输入新密码">
                    </div>
                    <button type="submit" class="btn-primary w-full py-3 rounded-lg font-bold">重置密码</button>
                </form>

                <div class="mt-6 pt-6 border-t border-forest-700 text-center">
                    <p class="text-sm text-cream/60">
                        想起密码了？ <a href="{{ url_for('main.login') }}" class="text-gold-400 hover:text-gold-500 font-medium">返回登录</a>
                    </p>
                </div>
            </div>
        </div>
    </section>
{% endblock %}

{% block extra_script %}
<script>
// 加载图形验证码
function loadCaptcha() {
    const img = document.getElementById('captcha-img');
    const captchaIdInput = document.getElementById('captcha-id');
    fetch('/api/captcha/generate')
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                img.src = data.image;
                if (captchaIdInput) captchaIdInput.value = data.captcha_id || '';
            }
        })
        .catch(err => console.error('加载验证码失败:', err));
}

loadCaptcha();
document.getElementById('captcha-img').addEventListener('click', loadCaptcha);

// 发送邮箱验证码
(function() {
    const btn = document.getElementById('btn-send-email-code');
    if (!btn) return;

    btn.addEventListener('click', function() {
        const emailInput = document.getElementById('fp-email');
        const captchaInput = document.querySelector('input[name="captcha"]');
        const captchaIdInput = document.getElementById('captcha-id');

        if (!emailInput || !emailInput.value.trim()) {
            Toast.warning('请先输入邮箱地址');
            return;
        }
        if (!captchaInput || !captchaInput.value.trim()) {
            Toast.warning('请先输入图形验证码');
            return;
        }

        const email = emailInput.value.trim();
        const captcha = captchaInput.value.trim();
        const captchaId = captchaIdInput ? captchaIdInput.value : '';
        btn.disabled = true;
        btn.textContent = '发送中...';

        fetch('/api/email/send-code', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                email: email,
                purpose: '找回密码',
                captcha: captcha,
                captcha_id: captchaId
            })
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                btn.textContent = '已发送';
                let countdown = 60;
                const timer = setInterval(function() {
                    btn.textContent = countdown + 's';
                    countdown--;
                    if (countdown < 0) {
                        clearInterval(timer);
                        btn.disabled = false;
                        btn.textContent = '发送验证码';
                    }
                }, 1000);
            } else {
                Toast.error(data.message || '发送失败');
                if (data.need_captcha) {
                    loadCaptcha();
                    if (captchaInput) captchaInput.value = '';
                }
                btn.disabled = false;
                btn.textContent = '发送验证码';
            }
        })
        .catch(function() {
            Toast.error('网络错误，请重试');
            btn.disabled = false;
            btn.textContent = '发送验证码';
        });
    });
})();
</script>
{% endblock %}
