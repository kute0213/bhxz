{% extends "base.html" %}
{% block title %}服务器状态{% endblock %}
{% block content %}
<section class="page-container py-12">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="mb-8">
            <h1 class="text-xl sm:text-2xl font-bold">服务器状态</h1>
            <p class="text-cream/60 text-sm mt-1">查看服务器实时运行状态，数据每 5 秒自动刷新</p>
        </div>

        <!-- ====== CPU 使用率 ====== -->
        <div class="pixel-card rounded-xl p-6 mb-5">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-blue-400/15 rounded-xl flex items-center justify-center">
                        <i data-lucide="cpu" class="w-5 h-5 text-blue-400"></i>
                    </div>
                    <div>
                        <div class="text-base font-bold text-cream/90">CPU 使用率</div>
                        <div class="text-xs text-cream/50">中央处理器</div>
                    </div>
                </div>
                <span class="text-2xl font-bold text-blue-400" id="status-cpu">-</span>
            </div>
            <div class="w-full h-3 bg-forest-900/60 rounded-full overflow-hidden">
                <div class="h-full rounded-full transition-all duration-700 ease-out" id="cpu-bar" style="width: 0%; background: linear-gradient(90deg, #34d399, #60a5fa);"></div>
            </div>
            <div class="flex justify-between mt-2 text-xs text-cream/40">
                <span>0%</span>
                <span>50%</span>
                <span>100%</span>
            </div>
        </div>

        <!-- ====== 内存使用率 ====== -->
        <div class="pixel-card rounded-xl p-6 mb-5">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-purple-400/15 rounded-xl flex items-center justify-center">
                        <i data-lucide="server" class="w-5 h-5 text-purple-400"></i>
                    </div>
                    <div>
                        <div class="text-base font-bold text-cream/90">内存使用率</div>
                        <div class="text-xs text-cream/50">运行内存</div>
                    </div>
                </div>
                <span class="text-2xl font-bold text-purple-400" id="status-memory">-</span>
            </div>
            <div class="w-full h-3 bg-forest-900/60 rounded-full overflow-hidden">
                <div class="h-full rounded-full transition-all duration-700 ease-out" id="mem-bar" style="width: 0%; background: linear-gradient(90deg, #34d399, #a78bfa);"></div>
            </div>
            <div class="flex justify-between mt-2 text-xs text-cream/40">
                <span>0%</span>
                <span>50%</span>
                <span>100%</span>
            </div>
            <div class="mt-3 text-xs text-cream/50 text-center" id="status-memory-detail"></div>
        </div>

        <!-- ====== CPU 温度 ====== -->
        <div class="pixel-card rounded-xl p-6 mb-5">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-orange-400/15 rounded-xl flex items-center justify-center">
                        <i data-lucide="thermometer" class="w-5 h-5 text-orange-400"></i>
                    </div>
                    <div>
                        <div class="text-base font-bold text-cream/90">CPU 温度</div>
                        <div class="text-xs text-cream/50">处理器温度</div>
                    </div>
                </div>
                <span class="text-2xl font-bold text-orange-400" id="status-cpu-temp">-</span>
            </div>
            <div class="w-full h-3 bg-forest-900/60 rounded-full overflow-hidden">
                <div class="h-full rounded-full transition-all duration-700 ease-out" id="temp-bar" style="width: 0%; background: linear-gradient(90deg, #34d399, #fbbf24, #ef4444);"></div>
            </div>
            <div class="flex justify-between mt-2 text-xs text-cream/40">
                <span>0°C</span>
                <span>50°C</span>
                <span>100°C</span>
            </div>
        </div>

        <!-- ====== 在线玩家列表（含在线/最大/服务器状态） ====== -->
        <div class="pixel-card rounded-xl p-6">
            <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
                <h2 class="text-lg font-bold flex items-center gap-2">
                    <i data-lucide="users" class="w-5 h-5 text-gold-400"></i>
                    在线玩家列表
                </h2>
                <div class="flex flex-wrap items-center gap-2 text-xs">
                    <span class="px-3 py-1.5 bg-forest-900/50 border border-cream/10 rounded-lg text-cream/70">
                        在线 <b class="text-green-400 ml-1" id="status-online">-</b>
                    </span>
                    <span class="px-3 py-1.5 bg-forest-900/50 border border-cream/10 rounded-lg text-cream/70">
                        最大 <b class="text-gold-400 ml-1" id="status-max">-</b>
                    </span>
                    <span class="px-3 py-1.5 bg-forest-900/50 border border-cream/10 rounded-lg text-cream/70">
                        状态 <b class="ml-1" id="status-status">检测中</b>
                    </span>
                </div>
            </div>
            <div id="player-list" class="flex flex-wrap gap-2">
                <div class="text-cream/50 text-sm py-4">加载中...</div>
            </div>
        </div>
    </div>
</section>
{% endblock %}

{% block extra_script %}
<script>
(function() {
    var POLL_INTERVAL = 5000;

    function formatBytes(bytes) {
        if (bytes === 0) return '0 B';
        var units = ['B', 'KB', 'MB', 'GB'];
        var i = Math.floor(Math.log(bytes) / Math.log(1024));
        if (i >= units.length) i = units.length - 1;
        return (bytes / Math.pow(1024, i)).toFixed(1) + ' ' + units[i];
    }

    function updateStatus() {
        fetch('/api/server-status')
            .then(function(r) { return r.json(); })
            .then(function(d) {
                // CPU 使用率
                var cpu = d.cpu_percent !== undefined ? d.cpu_percent : 0;
                document.getElementById('status-cpu').textContent = cpu.toFixed(1) + '%';
                document.getElementById('cpu-bar').style.width = Math.min(cpu, 100) + '%';

                // 内存使用率
                if (d.memory_percent !== undefined) {
                    document.getElementById('status-memory').textContent = d.memory_percent.toFixed(1) + '%';
                    document.getElementById('mem-bar').style.width = Math.min(d.memory_percent, 100) + '%';
                    document.getElementById('status-memory-detail').textContent =
                        '已用 ' + formatBytes(d.memory_used) + ' / 总计 ' + formatBytes(d.memory_total);
                }

                // CPU 温度
                var tempEl = document.getElementById('status-cpu-temp');
                var tempBar = document.getElementById('temp-bar');
                if (d.cpu_temp !== null && d.cpu_temp !== undefined) {
                    var temp = typeof d.cpu_temp === 'number' ? d.cpu_temp : parseFloat(d.cpu_temp);
                    tempEl.textContent = temp.toFixed(1) + '°C';
                    tempBar.style.width = Math.min(temp / 1.2, 100) + '%';
                } else {
                    tempEl.textContent = 'N/A';
                    tempBar.style.width = '0%';
                }

                // 玩家概览
                document.getElementById('status-online').textContent = d.online;
                document.getElementById('status-max').textContent = d.max_players;

                var statusEl = document.getElementById('status-status');
                if (d.error) {
                    statusEl.textContent = '离线';
                    statusEl.className = 'ml-1 text-red-400';
                } else {
                    statusEl.textContent = '在线';
                    statusEl.className = 'ml-1 text-green-400';
                }

                // 玩家列表
                var listEl = document.getElementById('player-list');
                if (d.error) {
                    listEl.innerHTML = '<div class="text-red-400/70 text-sm py-4">无法连接到服务器</div>';
                    return;
                }
                if (d.players.length === 0) {
                    listEl.innerHTML = '<div class="text-cream/50 text-sm py-4">当前没有玩家在线</div>';
                    return;
                }
                var html = '';
                for (var i = 0; i < d.players.length; i++) {
                    html += '<span class="px-3 py-1.5 bg-forest-900/50 border border-cream/10 rounded-lg text-sm text-cream/80">' +
                        escapeHtml(d.players[i]) + '</span>';
                }
                listEl.innerHTML = html;
            })
            .catch(function() {
                document.getElementById('status-online').textContent = '-';
                document.getElementById('status-max').textContent = '-';
                document.getElementById('status-status').textContent = '离线';
                document.getElementById('status-status').className = 'ml-1 text-red-400';
                document.getElementById('player-list').innerHTML = '<div class="text-red-400/70 text-sm py-4">数据获取失败</div>';
            });
    }

    function escapeHtml(str) {
        var div = document.createElement('div');
        div.appendChild(document.createTextNode(str));
        return div.innerHTML;
    }

    updateStatus();
    setInterval(updateStatus, POLL_INTERVAL);
})();
</script>
{% endblock %}
