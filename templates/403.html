{% extends "base.html" %}
{% block title %}权限不足{% endblock %}
{% block content %}
    <section class="page-container flex items-center justify-center">
        <div class="text-center px-6">
            <div class="w-24 h-24 mx-auto bg-red-500/10 rounded-full flex items-center justify-center mb-8">
                <i data-lucide="shield-alert" class="w-12 h-12 text-red-400 opacity-70"></i>
            </div>
            <h1 class="text-6xl font-black text-red-400 mb-4">403</h1>
            <p class="text-xl text-cream mb-2">权限不足</p>
            <p class="text-cream/60 mb-8">你没有权限访问此页面</p>
            <div class="flex items-center justify-center gap-4">
                <a href="{{ url_for('main.home') }}" class="btn-secondary px-6 py-3 rounded-xl font-bold inline-flex items-center gap-2">
                    <i data-lucide="home" class="w-5 h-5"></i>返回首页
                </a>
                {% if not user %}
                <a href="{{ url_for('main.login') }}" class="btn-primary px-6 py-3 rounded-xl font-bold inline-flex items-center gap-2">
                    <i data-lucide="log-in" class="w-5 h-5"></i>登录
                </a>
                {% endif %}
            </div>
        </div>
    </section>
{% endblock %}
