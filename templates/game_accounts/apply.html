{% extends "base.html" %}
{% block title %}申请账号{% endblock %}
{% block content %}
<section class="page-container py-8 sm:py-12">
    <div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8">

        <div class="mb-6 sm:mb-8">
            <a href="{{ url_for('main.home') }}" class="text-sky-600 hover:text-sky-500 text-sm inline-block mb-3">
                <i data-lucide="arrow-left" class="w-4 h-4 inline mr-1"></i>返回首页
            </a>
            <h1 class="text-xl sm:text-2xl font-bold">申请注册游戏账号</h1>
            <p class="text-muted text-sm mt-1">申请创建一个新的 Minecraft 游戏账号，需管理员审核批准</p>
        </div>

        <div class="pixel-card rounded-xl p-5 sm:p-6">
            <form id="register-form" class="space-y-5">
                <div>
                    <label class="text-sm text-muted block mb-1.5">MC 用户名</label>
                    <input type="text" id="reg-username" placeholder="输入要注册的 MC 用户名" class="input-field w-full px-3 sm:px-4 py-2.5 text-sm" autocomplete="off">
                    <p class="text-xs text-muted mt-1.5">3-16 位，仅限字母、数字和下划线</p>
                </div>
                <button type="submit" id="apply-btn" class="btn-primary px-6 py-2.5 text-sm inline-flex items-center gap-2">
                    <i data-lucide="send" class="w-4 h-4"></i>提交申请
                </button>
            </form>
        </div>
    </div>
</section>
{% endblock %}

{% block extra_script %}
<script>
(function() {
    var pendingRegData = null;
    var applyBtn = document.getElementById('apply-btn');

    document.getElementById('register-form').addEventListener('submit', function(e) {
        e.preventDefault();
        var username = document.getElementById('reg-username').value.trim();

        if (!username) { Toast.error('请输入 MC 用户名'); return; }
        if (username.length < 3) { Toast.error('MC 用户名至少 3 个字符'); return; }
        if (username.length > 16) { Toast.error('MC 用户名不能超过 16 个字符'); return; }
        if (!/^[a-zA-Z0-9_]+$/.test(username)) { Toast.error('MC 用户名只能包含字母、数字和下划线'); return; }
        if (username.indexOf('__') !== -1) { Toast.error('MC 用户名不能包含连续下划线'); return; }

        pendingRegData = { mc_username: username };
        // 复用全局验证码弹窗（base.js CaptchaModal），验证通过后回调提交
        CaptchaModal.show('请输入验证码以完成申请', function(captchaId, captchaCode) {
            submitApplication(captchaId, captchaCode);
        });
    });

    function submitApplication(captchaId, captchaCode) {
        if (!pendingRegData) return;
        applyBtn.disabled = true;
        applyBtn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>提交中...';
        lucide.createIcons({ targets: [applyBtn] });

        fetch('/game-accounts/api/apply-register', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                mc_username: pendingRegData.mc_username,
                captcha_id: captchaId,
                captcha: captchaCode,
            }),
        })
        .then(function(r) { return r.json(); })
        .then(function(d) {
            if (d.success) {
                Toast.success(d.message);
                document.getElementById('reg-username').value = '';
                pendingRegData = null;
                setTimeout(function() {
                    window.location.href = '{{ url_for("main.home") }}';
                }, 1500);
            } else {
                Toast.error(d.message);
            }
        })
        .finally(function() {
            applyBtn.disabled = false;
            applyBtn.innerHTML = '<i data-lucide="send" class="w-4 h-4"></i>提交申请';
            lucide.createIcons({ targets: [applyBtn] });
        });
    }
})();
</script>
{% endblock %}
