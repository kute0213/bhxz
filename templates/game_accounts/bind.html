{% extends "base.html" %}
{% block title %}绑定游戏账号{% endblock %}
{% block content %}
<section class="page-container py-8 sm:py-12">
    <div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8">

        <div class="mb-6 sm:mb-8">
            <a href="{{ url_for('game_accounts.index') }}" class="text-gold-400 hover:text-gold-300 text-sm inline-block mb-3">
                <i data-lucide="arrow-left" class="w-4 h-4 inline mr-1"></i>返回游戏账号
            </a>
            <h1 class="text-xl sm:text-2xl font-bold">绑定已有游戏账号</h1>
            <p class="text-cream/60 text-sm mt-1">通过 RCON 验证游戏内密码，将你的游戏账号绑定到网站账户</p>
        </div>

        <div class="pixel-card rounded-xl p-5 sm:p-6">
            <form id="bind-form" class="space-y-5">
                <div>
                    <label class="text-sm text-cream/60 block mb-1.5">MC 用户名</label>
                    <input type="text" id="bind-username" placeholder="游戏内用户名" class="w-full px-3 sm:px-4 py-2.5 bg-forest-900/60 border border-cream/20 rounded-lg text-sm focus:outline-none focus:border-blue-400 transition-colors" autocomplete="off">
                </div>
                <div>
                    <label class="text-sm text-cream/60 block mb-1.5">密码</label>
                    <input type="password" id="bind-password" placeholder="游戏内登录密码" class="w-full px-3 sm:px-4 py-2.5 bg-forest-900/60 border border-cream/20 rounded-lg text-sm focus:outline-none focus:border-blue-400 transition-colors">
                </div>
                <button type="submit" id="bind-btn" class="w-full sm:w-auto px-6 py-2.5 bg-blue-500/20 hover:bg-blue-500/30 text-blue-300 text-sm rounded-lg transition-colors border border-blue-500/30 disabled:opacity-50 disabled:cursor-not-allowed">
                    <i data-lucide="shield-check" class="w-4 h-4 inline mr-1.5 bind-btn-icon"></i>
                    <span class="bind-btn-text">验证并绑定</span>
                </button>
            </form>
        </div>

        <div class="mt-6 text-center">
            <p class="text-xs text-cream/40">
                <i data-lucide="info" class="w-3 h-3 inline mr-1"></i>
                绑定后可以在游戏账号管理页面查看已绑定的账号列表
            </p>
        </div>
    </div>
</section>
{% endblock %}

{% block extra_script %}
<script>
(function() {
    var bindForm = document.getElementById('bind-form');
    var bindBtn = document.getElementById('bind-btn');
    var bindBtnIcon = bindBtn.querySelector('.bind-btn-icon');
    var bindBtnText = bindBtn.querySelector('.bind-btn-text');

    bindForm.addEventListener('submit', function(e) {
        e.preventDefault();
        if (bindBtn.disabled) return;

        var username = document.getElementById('bind-username').value.trim();
        var password = document.getElementById('bind-password').value;

        if (!username) { Toast.error('请输入 MC 用户名'); return; }
        if (username.length < 3) { Toast.error('MC 用户名至少 3 个字符'); return; }
        if (username.length > 16) { Toast.error('MC 用户名不能超过 16 个字符'); return; }
        if (!/^[a-zA-Z0-9_]+$/.test(username)) { Toast.error('MC 用户名只能包含字母、数字和下划线'); return; }
        if (!password) { Toast.error('请输入密码'); return; }

        CustomModal.confirm('确认绑定账号 <strong>' + escapeHtml(username) + '</strong>？系统将通过 RCON 验证游戏内密码。', {
            title: '绑定确认',
            confirmText: '验证并绑定',
            callback: function(confirmed) {
                if (!confirmed) return;

                bindBtn.disabled = true;
                bindBtnIcon.setAttribute('data-lucide', 'loader-2');
                lucide.createIcons({ targets: [bindBtnIcon] });
                bindBtnIcon.classList.add('animate-spin');
                bindBtnText.textContent = '验证中...';

                fetch('/game-accounts/api/bind', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        username: username,
                        password: password,
                    }),
                })
                .then(function(r) { return r.json(); })
                .then(function(d) {
                    if (d.success) {
                        CustomModal.alert(d.message, { type: 'success' });
                        document.getElementById('bind-password').value = '';
                        Toast.success('账号 ' + d.username + ' 已绑定');
                        // 延迟跳转到首页
                        setTimeout(function() {
                            window.location.href = '{{ url_for("game_accounts.index") }}';
                        }, 1500);
                    } else {
                        CustomModal.alert(d.message, { type: 'error' });
                    }
                })
                .catch(function(err) {
                    CustomModal.alert('网络错误，请检查网络连接后重试', { type: 'error' });
                })
                .finally(function() {
                    bindBtn.disabled = false;
                    bindBtnIcon.setAttribute('data-lucide', 'shield-check');
                    lucide.createIcons({ targets: [bindBtnIcon] });
                    bindBtnIcon.classList.remove('animate-spin');
                    bindBtnText.textContent = '验证并绑定';
                });
            }
        });
    });

    function escapeHtml(str) {
        var div = document.createElement('div');
        div.appendChild(document.createTextNode(str));
        return div.innerHTML;
    }
})();
</script>
{% endblock %}
