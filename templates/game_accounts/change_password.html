{% extends "base.html" %}
{% block title %}更改游戏密码{% endblock %}
{% block content %}
<section class="page-container py-8 sm:py-12">
    <div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8">

        <div class="mb-6 sm:mb-8">
            <a href="{{ url_for('game_accounts.index') }}" class="text-gold-400 hover:text-gold-300 text-sm inline-block mb-3">
                <i data-lucide="arrow-left" class="w-4 h-4 inline mr-1"></i>返回游戏账号
            </a>
            <h1 class="text-xl sm:text-2xl font-bold">更改游戏密码</h1>
            <p class="text-cream/60 text-sm mt-1">修改已绑定 Minecraft 账号的游戏内登录密码</p>
        </div>

        <div class="pixel-card rounded-xl p-5 sm:p-6">
            <form id="change-password-form" class="space-y-5">
                <!-- 选择账号 -->
                <div>
                    <label class="text-sm text-cream/60 block mb-1.5">选择要修改密码的账号</label>
                    {% if bound_accounts %}
                    <select id="select-account" class="w-full px-3 sm:px-4 py-2.5 bg-forest-900/60 border border-cream/20 rounded-lg text-sm focus:outline-none focus:border-blue-400 transition-colors">
                        <option value="">请选择账号...</option>
                        {% for account in bound_accounts %}
                        <option value="{{ account.mc_username }}" {% if request.args.get('mc_username') == account.mc_username %}selected{% endif %}>{{ account.mc_username }}</option>
                        {% endfor %}
                    </select>
                    {% else %}
                    <p class="text-cream/40 text-sm">你还没有绑定任何游戏账号，请先绑定后再修改密码。</p>
                    {% endif %}
                </div>

                <div id="password-fields" class="space-y-4 {% if not bound_accounts %}hidden{% endif %}">
                    <div>
                        <label class="text-sm text-cream/60 block mb-1.5">当前密码</label>
                        <input type="password" id="current-password" placeholder="输入当前游戏内密码" class="w-full px-3 sm:px-4 py-2.5 bg-forest-900/60 border border-cream/20 rounded-lg text-sm focus:outline-none focus:border-blue-400 transition-colors">
                    </div>
                    <div>
                        <label class="text-sm text-cream/60 block mb-1.5">新密码</label>
                        <input type="password" id="new-password" placeholder="输入新密码（4-32 个字符）" class="w-full px-3 sm:px-4 py-2.5 bg-forest-900/60 border border-cream/20 rounded-lg text-sm focus:outline-none focus:border-blue-400 transition-colors">
                    </div>
                    <div>
                        <label class="text-sm text-cream/60 block mb-1.5">确认新密码</label>
                        <input type="password" id="confirm-password" placeholder="再次输入新密码" class="w-full px-3 sm:px-4 py-2.5 bg-forest-900/60 border border-cream/20 rounded-lg text-sm focus:outline-none focus:border-blue-400 transition-colors">
                    </div>
                    <button type="submit" id="change-pwd-btn" class="w-full sm:w-auto px-6 py-2.5 bg-blue-500/20 hover:bg-blue-500/30 text-blue-300 text-sm rounded-lg transition-colors border border-blue-500/30 disabled:opacity-50 disabled:cursor-not-allowed">
                        <i data-lucide="key" class="w-4 h-4 inline mr-1.5"></i>确认修改
                    </button>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}

{% block extra_script %}
<script>
(function() {
    var selectAccount = document.getElementById('select-account');
    var passwordFields = document.getElementById('password-fields');
    var changeForm = document.getElementById('change-password-form');
    var changeBtn = document.getElementById('change-pwd-btn');

    if (selectAccount) {
        selectAccount.addEventListener('change', function() {
            if (this.value) {
                passwordFields.classList.remove('hidden');
            } else {
                passwordFields.classList.add('hidden');
            }
        });

        // 如果 URL 中有 mc_username 参数，自动触发显示
        if (selectAccount.value) {
            passwordFields.classList.remove('hidden');
        }
    }

    changeForm.addEventListener('submit', function(e) {
        e.preventDefault();
        if (changeBtn.disabled) return;

        var mcUsername = selectAccount ? selectAccount.value : '';
        var currentPassword = document.getElementById('current-password').value;
        var newPassword = document.getElementById('new-password').value;
        var confirmPassword = document.getElementById('confirm-password').value;

        if (!mcUsername) { Toast.error('请选择要修改密码的账号'); return; }
        if (!currentPassword) { Toast.error('请输入当前密码'); return; }
        if (!newPassword) { Toast.error('请输入新密码'); return; }
        if (newPassword.length < 4) { Toast.error('新密码至少 4 个字符'); return; }
        if (newPassword.length > 32) { Toast.error('新密码不能超过 32 个字符'); return; }
        if (newPassword !== confirmPassword) { Toast.error('两次输入的新密码不一致'); return; }
        if (newPassword === currentPassword) { Toast.error('新密码不能与当前密码相同'); return; }

        CustomModal.confirm('确认修改 <strong>' + escapeHtml(mcUsername) + '</strong> 的密码？', {
            title: '修改密码确认',
            confirmText: '确认修改',
            callback: function(confirmed) {
                if (!confirmed) return;

                // 先完成图形验证码，验证通过后再提交修改请求
                CaptchaModal.show('请输入图形验证码以确认修改密码', function(captchaId, captcha) {
                    doChangePassword(mcUsername, currentPassword, newPassword, captchaId, captcha);
                });
            }
        });
    });

    function doChangePassword(mcUsername, currentPassword, newPassword, captchaId, captcha) {
        changeBtn.disabled = true;
        changeBtn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 inline mr-1.5 animate-spin"></i>修改中...';
        lucide.createIcons({ targets: [changeBtn] });

        fetch('/game-accounts/api/change-password', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                mc_username: mcUsername,
                current_password: currentPassword,
                new_password: newPassword,
                captcha_id: captchaId,
                captcha: captcha,
            }),
        })
        .then(function(r) { return r.json(); })
        .then(function(d) {
            if (d.success) {
                CustomModal.alert(d.message, { type: 'success' });
                document.getElementById('current-password').value = '';
                document.getElementById('new-password').value = '';
                document.getElementById('confirm-password').value = '';
                setTimeout(function() {
                    window.location.href = '{{ url_for("game_accounts.index") }}';
                }, 1500);
            } else {
                CustomModal.alert(d.message, { type: 'error' });
            }
        })
        .catch(function(err) {
            CustomModal.alert('网络错误，请检查网络连接后重试', { type: 'error' });
        })
        .finally(function() {
            changeBtn.disabled = false;
            changeBtn.innerHTML = '<i data-lucide="key" class="w-4 h-4 inline mr-1.5"></i>确认修改';
            lucide.createIcons({ targets: [changeBtn] });
        });
    }

    function escapeHtml(str) {
        var div = document.createElement('div');
        div.appendChild(document.createTextNode(str));
        return div.innerHTML;
    }
})();
</script>
{% endblock %}
