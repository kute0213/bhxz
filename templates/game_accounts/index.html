{% extends "base.html" %}
{% block title %}游戏账号{% endblock %}
{% block content %}
<section class="page-container py-12">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">

        <div class="text-center mb-10">
            <h1 class="text-2xl sm:text-3xl font-bold mb-3">游戏账号</h1>
            <p class="text-cream/60">申请注册新的 Minecraft 游戏账号</p>
        </div>

        <!-- 申请注册新账号 -->
        <div class="pixel-card rounded-xl p-6">
            <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
                <i data-lucide="user-plus" class="w-5 h-5 text-gold-400"></i>
                申请注册游戏账号
            </h2>
            <p class="text-cream/50 text-sm mb-4">申请创建一个新的 Minecraft 游戏账号，需管理员审核批准。</p>

            <form id="register-form" class="space-y-4">
                <div>
                    <label class="text-xs text-cream/60 block mb-1">MC 用户名</label>
                    <input type="text" id="reg-username" placeholder="输入要注册的 MC 用户名" class="w-full px-3 py-2 bg-forest-900/60 border border-cream/20 rounded-lg text-sm focus:outline-none focus:border-gold-400 transition-colors">
                </div>
                <div>
                    <label class="text-xs text-cream/60 block mb-1">密码</label>
                    <input type="password" id="reg-password" placeholder="游戏内登录密码" class="w-full px-3 py-2 bg-forest-900/60 border border-cream/20 rounded-lg text-sm focus:outline-none focus:border-gold-400 transition-colors">
                </div>
                <button type="submit" class="px-5 py-2 bg-blue-500/20 hover:bg-blue-500/30 text-blue-300 text-sm rounded-lg transition-colors border border-blue-500/30">
                    <i data-lucide="send" class="w-4 h-4 inline mr-1"></i>提交申请
                </button>
            </form>
        </div>
    </div>
</section>

<!-- ===== 验证码弹窗（注册申请时弹出） ===== -->
<div id="captcha-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm" onclick="if(event.target===this)closeCaptchaModal()">
    <div class="bg-forest-800 border border-cream/20 rounded-2xl p-6 sm:p-8 w-full max-w-sm mx-4 shadow-2xl" onclick="event.stopPropagation()">
        <h3 class="text-lg font-bold mb-2">图形验证码</h3>
        <p class="text-cream/60 text-sm mb-4">请输入验证码以完成申请</p>
        <div class="flex flex-col items-center gap-3 mb-4">
            <img id="captcha-image" src="" alt="验证码" class="h-14 rounded-lg cursor-pointer border border-cream/20" onclick="refreshCaptcha()">
            <input type="text" id="captcha-input" placeholder="输入验证码" maxlength="6" class="w-full px-3 py-2 bg-forest-900/60 border border-cream/20 rounded-lg text-sm focus:outline-none focus:border-gold-400 transition-colors text-center tracking-widest" autocomplete="off">
            <input type="hidden" id="captcha-id" value="">
            <p class="text-xs text-cream/40">点击图片刷新验证码</p>
        </div>
        <div class="flex justify-end gap-3">
            <button onclick="closeCaptchaModal()" class="px-4 py-2 text-sm text-cream/60 hover:text-cream transition-colors">取消</button>
            <button id="captcha-modal-confirm" class="px-5 py-2 bg-blue-500/20 hover:bg-blue-500/30 text-blue-300 text-sm rounded-lg transition-colors border border-blue-500/30">确认提交</button>
        </div>
        <p id="captcha-modal-error" class="hidden text-red-400 text-xs mt-3"></p>
    </div>
</div>
{% endblock %}

{% block extra_script %}
<script>
(function() {
    var pendingRegData = null;

    function refreshCaptcha() {
        fetch('/api/captcha/generate')
            .then(function(r) { return r.json(); })
            .then(function(d) {
                if (d.success) {
                    document.getElementById('captcha-image').src = d.image;
                    document.getElementById('captcha-id').value = d.captcha_id;
                }
            });
    }

    window.closeCaptchaModal = function() {
        document.getElementById('captcha-modal').classList.add('hidden');
        document.getElementById('captcha-input').value = '';
        document.getElementById('captcha-modal-error').classList.add('hidden');
        pendingRegData = null;
    };

    // ===== 注册申请（先校验，再弹出验证码弹窗） =====
    document.getElementById('register-form').addEventListener('submit', function(e) {
        e.preventDefault();
        var username = document.getElementById('reg-username').value.trim();
        var password = document.getElementById('reg-password').value;

        if (!username) { Toast.error('请输入 MC 用户名'); return; }
        if (username.length < 3) { Toast.error('MC 用户名至少 3 个字符'); return; }
        if (username.length > 16) { Toast.error('MC 用户名不能超过 16 个字符'); return; }
        if (!/^[a-zA-Z0-9_]+$/.test(username)) { Toast.error('MC 用户名只能包含字母、数字和下划线'); return; }
        if (username.indexOf('__') !== -1) { Toast.error('MC 用户名不能包含连续下划线'); return; }

        if (!password) { Toast.error('请输入密码'); return; }
        if (password.length < 8) { Toast.error('密码至少 8 位'); return; }
        if (!/[a-zA-Z]/.test(password)) { Toast.error('密码必须包含至少一个字母'); return; }
        if (!/[0-9]/.test(password)) { Toast.error('密码必须包含至少一个数字'); return; }
        if (/\s/.test(password)) { Toast.error('密码不能包含空格'); return; }

        pendingRegData = { mc_username: username, password: password };
        refreshCaptcha();
        document.getElementById('captcha-input').value = '';
        document.getElementById('captcha-modal-error').classList.add('hidden');
        document.getElementById('captcha-modal').classList.remove('hidden');
        document.getElementById('captcha-input').focus();
    });

    document.getElementById('captcha-modal-confirm').addEventListener('click', function() {
        var captcha = document.getElementById('captcha-input').value.trim();
        var captchaId = document.getElementById('captcha-id').value;
        var errEl = document.getElementById('captcha-modal-error');

        if (!captcha) { errEl.textContent = '请输入验证码'; errEl.classList.remove('hidden'); return; }
        if (!pendingRegData) { errEl.textContent = '提交数据丢失，请重新申请'; errEl.classList.remove('hidden'); return; }
        errEl.classList.add('hidden');

        fetch('/game-accounts/api/apply-register', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                mc_username: pendingRegData.mc_username,
                password: pendingRegData.password,
                captcha_id: captchaId,
                captcha: captcha,
            }),
        })
        .then(function(r) { return r.json(); })
        .then(function(d) {
            if (d.success) {
                Toast.success(d.message);
                closeCaptchaModal();
                document.getElementById('reg-username').value = '';
                document.getElementById('reg-password').value = '';
                pendingRegData = null;
            } else {
                Toast.error(d.message);
                refreshCaptcha();
                document.getElementById('captcha-input').value = '';
                document.getElementById('captcha-input').focus();
            }
        });
    });

    document.getElementById('captcha-input').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') { document.getElementById('captcha-modal-confirm').click(); }
    });
})();
</script>
{% endblock %}
